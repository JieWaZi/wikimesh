name: build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 普通构建测试
    runs-on: ubuntu-latest
    steps:
      # 拉取当前仓库源码。
      - name: Checkout
        uses: actions/checkout@v4

      # 按 go.mod 中声明的版本安装 Go。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 普通测试不需要 llama.cpp 动态库。
      - name: Test
        run: make test

  package:
    name: package ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 CPU 动态库包。
          - os: ubuntu-24.04
            asset: linux-amd64
            processor: cpu
          # Linux arm64 CPU 动态库包。
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            processor: cpu
          # macOS Intel CPU 动态库包。
          - os: macos-15-intel
            asset: darwin-amd64
            processor: cpu
          # macOS arm64 Metal 动态库包。
          - os: macos-15
            asset: darwin-arm64-metal
            processor: metal

    steps:
      # 拉取当前仓库源码。
      - name: Checkout
        uses: actions/checkout@v4

      # 按 go.mod 中声明的版本安装 Go。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 构建 wikimesh 二进制。
      - name: Build binary
        run: make build BINARY=.wikimesh/bin/wikimesh-${{ matrix.asset }}

      # 安装 yzma/llama.cpp 预编译动态库。
      - name: Install llama.cpp libraries
        run: make install-llama BINARY=.wikimesh/bin/wikimesh-${{ matrix.asset }} LLAMA_PROCESSOR=${{ matrix.processor }}

      # 确认构建产物可以启动并打印帮助。
      - name: Smoke test
        run: .wikimesh/bin/wikimesh-${{ matrix.asset }} --help

      # 打包当前平台产物。
      - name: Package
        run: make package BINARY=.wikimesh/bin/wikimesh-${{ matrix.asset }} PACKAGE=.wikimesh/dist/wikimesh-${{ matrix.asset }}.tar.gz

      # 生成当前平台产物 checksum，供 release 阶段合并为 checksums.txt。
      - name: Generate checksum
        run: |
          cd .wikimesh/dist
          shasum -a 256 wikimesh-${{ matrix.asset }}.tar.gz > wikimesh-${{ matrix.asset }}.sha256

      # 上传多平台构建产物。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikimesh-${{ matrix.asset }}
          path: .wikimesh/dist/wikimesh-${{ matrix.asset }}.tar.gz

      # 上传当前平台 checksum。
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: wikimesh-${{ matrix.asset }}-checksum
          path: .wikimesh/dist/wikimesh-${{ matrix.asset }}.sha256

  package-windows:
    name: package windows-amd64
    runs-on: windows-latest
    steps:
      # 拉取当前仓库源码。
      - name: Checkout
        uses: actions/checkout@v4

      # 按 go.mod 中声明的版本安装 Go。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Windows 不走 Makefile，避免 Unix shell 语法和 PowerShell 不兼容。
      - name: Build binary
        shell: pwsh
        run: |
          $env:GOCACHE = Join-Path $env:RUNNER_TEMP "wikimesh-go-build-cache"
          New-Item -ItemType Directory -Force .wikimesh/bin | Out-Null
          go build -o .wikimesh/bin/wikimesh-windows-amd64.exe ./cmd/wikimesh

      # 安装 Windows 版 yzma/llama.cpp 预编译动态库。
      - name: Install llama.cpp libraries
        shell: pwsh
        run: '& .\.wikimesh\bin\wikimesh-windows-amd64.exe model lib install --lib .wikimesh/lib --processor cpu --os windows'

      # 确认构建产物可以启动并打印帮助。
      - name: Smoke test
        shell: pwsh
        run: '& .\.wikimesh\bin\wikimesh-windows-amd64.exe --help'

      # 打包 Windows 产物。zip 是 Windows 用户最自然的分发格式。
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .wikimesh/package | Out-Null
          New-Item -ItemType Directory -Force .wikimesh/dist | Out-Null
          Copy-Item .wikimesh/bin/wikimesh-windows-amd64.exe .wikimesh/package/
          if (Test-Path .wikimesh/lib) {
            Copy-Item .wikimesh/lib/* .wikimesh/package/ -Recurse -Force
          }
          Compress-Archive -Path .wikimesh/package/* -DestinationPath .wikimesh/dist/wikimesh-windows-amd64.zip -Force

      # 生成 Windows 产物 checksum，供 release 阶段合并为 checksums.txt。
      - name: Generate checksum
        shell: pwsh
        run: |
          $file = ".wikimesh/dist/wikimesh-windows-amd64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash  wikimesh-windows-amd64.zip" | Set-Content -NoNewline .wikimesh/dist/wikimesh-windows-amd64.sha256

      # 上传 Windows 构建产物。
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikimesh-windows-amd64
          path: .wikimesh/dist/wikimesh-windows-amd64.zip

      # 上传 Windows checksum。
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: wikimesh-windows-amd64-checksum
          path: .wikimesh/dist/wikimesh-windows-amd64.sha256

  checksums:
    name: generate checksums.txt
    runs-on: ubuntu-latest
    needs: [package, package-windows]
    steps:
      # 下载所有平台 checksum artifact。
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          pattern: wikimesh-*-checksum
          path: .wikimesh/checksums
          merge-multiple: true

      # 合并为 release 使用的 checksums.txt。
      - name: Merge checksums
        run: |
          mkdir -p .wikimesh/dist
          find .wikimesh/checksums -name '*.sha256' -print0 | sort -z | while IFS= read -r -d '' file; do
            cat "$file"
            printf '\n'
          done > .wikimesh/dist/checksums.txt

      # 上传合并后的 checksums.txt。
      - name: Upload checksums.txt
        uses: actions/upload-artifact@v4
        with:
          name: checksums.txt
          path: .wikimesh/dist/checksums.txt

      # 标签构建时下载所有 release 产物，准备发布到 GitHub Release。
      - name: Download release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          pattern: wikimesh-*
          path: .wikimesh/release
          merge-multiple: true

      # 标签构建时发布 GitHub Release 产物，供 wikimesh update 下载。
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
          files: |
            .wikimesh/release/wikimesh-linux-amd64.tar.gz
            .wikimesh/release/wikimesh-linux-arm64.tar.gz
            .wikimesh/release/wikimesh-darwin-amd64.tar.gz
            .wikimesh/release/wikimesh-darwin-arm64-metal.tar.gz
            .wikimesh/release/wikimesh-windows-amd64.zip
            .wikimesh/dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1
